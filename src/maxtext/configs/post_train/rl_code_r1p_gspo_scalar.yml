# Arm R1' (True Scalar GSPO Baseline):
#   - Sequence-level geometric importance ratio (loss_algo: "gspo-token", gspo_pool_mode: "sequence")
#   - Scalar sequence advantage (advantage_estimator: "grpo", token_advantage_mode: "none")
#   - Sequence-mean-token-mean aggregation (loss_agg_mode: "sequence-mean-token-mean")
#   - Standard PPO min-clipping (clip_mode: "ppo", eps_l=3e-4, eps_h=4e-4)
#   - Micro-batch-consistent trainer old logprobs (use_rollout_logps: false) + token-level TIS (C=2.0)

base_config: "rl_code_gspo_mimo.yml"
run_name: "r1p_gspo_scalar"

rl:
  off_policy_steps: 0
  loss_algo: "gspo-token"
  gspo_pool_mode: "sequence"
  loss_agg_mode: "sequence-mean-token-mean"
  advantage_estimator: "grpo"
  token_advantage_mode: "none"
  clip_mode: "ppo"
  grpo_epsilon: 3.0e-4
  epsilon_high: 4.0e-4
  use_rollout_logps: false
  sampler_is: "token"
  sampler_is_threshold: 2.0
