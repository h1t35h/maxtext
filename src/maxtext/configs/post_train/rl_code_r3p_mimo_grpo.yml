# Arm R3' (Fair Token-Level MiMo-GRPO Baseline, token-mean):
#   - Token-level importance ratio (loss_algo: "grpo")
#   - Token-mean loss aggregation (loss_agg_mode: "token-mean")
#   - Mass-conserving MiMo-V2-Flash advantage shaping (beta_pos=0.5, span_renormalize=true)
#   - Standard PPO clipping (clip_mode: "ppo", eps=0.20, eps_high=0.28)
#   - Micro-batch-consistent trainer old logprobs (use_rollout_logps: false) + token-level TIS (C=2.0)

base_config: "rl_code_gspo_mimo.yml"
run_name: "r3p_mimo_grpo"

rl:
  off_policy_steps: 0
  loss_algo: "grpo"
  loss_agg_mode: "token-mean"
  advantage_estimator: "mimo"
  token_advantage_mode: "mimo"
  clip_mode: "ppo"
  grpo_epsilon: 0.20
  epsilon_high: 0.28
  epsilon_neg: 0.20
  epsilon_neg_high: 0.28
  use_rollout_logps: false
  sampler_is: "token"
  sampler_is_threshold: 2.0
