# Alias for Arm R2'' (Turn-Level GSPO-MiMo): rl_code_r2pp_turn_gspo_mimo.yml

base_config: "rl_code_gspo_mimo.yml"
run_name: "r2pp_turn_gspo_mimo"

rl:
  off_policy_steps: 0
  loss_algo: "gspo-turn"
  gspo_pool_mode: "turn"
  loss_agg_mode: "sequence-mean-token-mean"
  advantage_estimator: "mimo"
  token_advantage_mode: "mimo"
  clip_mode: "ppo"
  grpo_epsilon: 3.0e-4
  epsilon_high: 4.0e-4
  use_rollout_logps: false
  sampler_is: "token"
  sampler_is_threshold: 2.0
