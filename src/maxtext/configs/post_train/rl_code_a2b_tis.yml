# Ablation A2b: Arm 2 (GSPO-MiMo) with truncated importance sampling (tis) + sequence rejection sampling
base_config: "rl_code_gspo_mimo.yml"

rl:
  loss_algo: "gspo-token"
  clip_mode: "ppo"
  advantage_estimator: "mimo"
  token_advantage_mode: "mimo"
  loss_agg_mode: "token-mean"
  grpo_epsilon: 3.0e-4
  epsilon_high: 4.0e-4
  sampler_is: "token"
  sampler_is_threshold: 2.0
  sampler_rs: "geometric"
  sampler_rs_min: 0.9997
  sampler_rs_max: 1.0004
