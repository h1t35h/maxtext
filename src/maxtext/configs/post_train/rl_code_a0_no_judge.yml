# Ablation A0: Arm 3 (MiMo-GRPO) with LLM judge disabled (local deterministic rules only, f_i=1.0)
base_config: "rl_code_gspo_mimo.yml"

rl:
  loss_algo: "grpo"
  clip_mode: "mask"
  advantage_estimator: "mimo"
  token_advantage_mode: "mimo"
  loss_agg_mode: "token-mean"
  grpo_epsilon: 0.8
  epsilon_high: 4.0
  epsilon_neg: 0.8
  epsilon_neg_high: 4.0
  judge_base_url: ""
